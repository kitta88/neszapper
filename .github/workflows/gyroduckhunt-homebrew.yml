name: Build Gyro Zapper NES for Switch

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - '.github/workflows/gyroduckhunt-homebrew.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 for Switch if the image does not include it
        run: |
          if [ ! -x "$DEVKITPRO/portlibs/switch/bin/sdl2-config" ]; then
            dkp-pacman -Sy --noconfirm switch-sdl2
          fi
          dkp-pacman -Sy --noconfirm switch-sdl2_ttf
          "$DEVKITPRO/portlibs/switch/bin/sdl2-config" --version

      - name: Install multilingual UI fonts
        run: |
          apt-get update
          apt-get install -y fonts-noto-core fonts-noto-cjk
          mkdir -p standalone/romfs
          cp /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf standalone/romfs/
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc standalone/romfs/
          test -s standalone/romfs/NotoSans-Regular.ttf
          test -s standalone/romfs/NotoSansCJK-Regular.ttc

      - name: Check out Nestopia core
        uses: actions/checkout@v4
        with:
          repository: libretro/nestopia
          ref: master
          path: nestopia
          submodules: recursive

      - name: Build Nestopia static core
        run: |
          make -C nestopia/libretro -j"$(getconf _NPROCESSORS_ONLN)" platform=libnx
          test -s nestopia/libretro/nestopia_libretro_libnx.a
          cp nestopia/libretro/nestopia_libretro_libnx.a standalone/libnestopia.a

      - name: Build Switch homebrew
        run: |
          echo "NROFLAGS=$NROFLAGS"
          du -h standalone/romfs/*
          make -C standalone -j"$(getconf _NPROCESSORS_ONLN)"
          test -s standalone/gyroduckhunt.nro
          grep -a -q 'NotoSans-Regular.ttf' standalone/gyroduckhunt.nro
          grep -a -q 'NotoSansCJK-Regular.ttc' standalone/gyroduckhunt.nro
          sha256sum standalone/gyroduckhunt.nro

      - uses: actions/upload-artifact@v4
        with:
          name: gyroduckhunt-switch-homebrew
          path: standalone/gyroduckhunt.nro
          if-no-files-found: error

      - name: Publish public NRO download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gyroduckhunt-build-${{ github.run_number }}
          name: Gyro Zapper NES build ${{ github.run_number }}
          body: Nintendo Switch homebrew build of Gyro Zapper NES.
          files: standalone/gyroduckhunt.nro
          fail_on_unmatched_files: true

