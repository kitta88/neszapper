name: Build Gyro Zapper NES for Switch

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - '.github/workflows/gyroduckhunt-homebrew.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 for Switch if the image does not include it
        run: |
          if [ ! -x "$DEVKITPRO/portlibs/switch/bin/sdl2-config" ]; then
            dkp-pacman -Sy --noconfirm switch-sdl2
          fi
          "$DEVKITPRO/portlibs/switch/bin/sdl2-config" --version

      - name: Check out Nestopia core
        uses: actions/checkout@v4
        with:
          repository: libretro/nestopia
          ref: master
          path: nestopia
          submodules: recursive

      - name: Build Nestopia static core
        run: |
          make -C nestopia/libretro -j"$(getconf _NPROCESSORS_ONLN)" platform=libnx
          test -s nestopia/libretro/nestopia_libretro_libnx.a
          cp nestopia/libretro/nestopia_libretro_libnx.a standalone/libnestopia.a

      - name: Build Switch homebrew
        run: |
          make -C standalone -j"$(getconf _NPROCESSORS_ONLN)"
          test -s standalone/gyroduckhunt.nro
          sha256sum standalone/gyroduckhunt.nro

      - uses: actions/upload-artifact@v4
        with:
          name: gyroduckhunt-switch-homebrew
          path: standalone/gyroduckhunt.nro
          if-no-files-found: error

