name: Build RetroArch 1.22.1 for Switch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Check out RetroArch 1.22.1
        uses: actions/checkout@v4
        with:
          repository: libretro/RetroArch
          ref: v1.22.1
          path: retroarch

      - name: Verify pinned source and patch
        run: |
          grep -F '#define PACKAGE_VERSION "1.22.1"' retroarch/version.all
          grep -F '[Switch Zapper] patched gyro mouse driver active on pad 2' patch/input/drivers/switch_input.c
          grep -F 'switch_joypad_lightgun_state' patch/input/drivers_joypad/switch_joypad.c
          echo "RetroArch source revision: $(git -C retroarch rev-parse HEAD)"

      - name: Apply and verify Switch input changes
        run: |
          cp patch/input/drivers/switch_input.c retroarch/input/drivers/switch_input.c
          cp patch/input/drivers_joypad/switch_joypad.c retroarch/input/drivers_joypad/switch_joypad.c
          cmp patch/input/drivers/switch_input.c retroarch/input/drivers/switch_input.c
          cmp patch/input/drivers_joypad/switch_joypad.c retroarch/input/drivers_joypad/switch_joypad.c

      - name: Check out Nestopia core
        uses: actions/checkout@v4
        with:
          repository: libretro/nestopia
          ref: master
          path: nestopia
          submodules: recursive

      - name: Enable dedicated Switch Gyro Zapper core mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("nestopia/libretro/libretro.cpp")
          source = path.read_text()

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one source match, found {count}: {old!r}")
              source = source.replace(old, new)

          replace_once(
              "#define RETRO_DEVICE_ZAPPER RETRO_DEVICE_SUBCLASS(RETRO_DEVICE_POINTER, 0)\n",
              "#define RETRO_DEVICE_ZAPPER RETRO_DEVICE_SUBCLASS(RETRO_DEVICE_POINTER, 0)\n"
              "#define RETRO_DEVICE_SWITCH_GYRO_ZAPPER RETRO_DEVICE_SUBCLASS(RETRO_DEVICE_POINTER, 1)\n"
          )
          replace_once(
              "static size_t state_size = 0;\n",
              "static size_t state_size = 0;\n"
              "static bool switch_gyro_zapper_mode = false;\n"
          )
          replace_once(
              '      { "Zapper", RETRO_DEVICE_ZAPPER },\n',
              '      { "Zapper", RETRO_DEVICE_ZAPPER },\n'
              '      { "Switch Gyro Zapper", RETRO_DEVICE_SWITCH_GYRO_ZAPPER },\n'
          )
          replace_once(
              "      case RETRO_DEVICE_ZAPPER:\n"
              "         Api::Input(emulator).ConnectController(port, Api::Input::ZAPPER);\n"
              "         break;\n",
              "      case RETRO_DEVICE_SWITCH_GYRO_ZAPPER:\n"
              "         if (port == 1) switch_gyro_zapper_mode = true;\n"
              "         Api::Input(emulator).ConnectController(port, Api::Input::ZAPPER);\n"
              "         break;\n"
              "      case RETRO_DEVICE_MOUSE:\n"
              "         if (port == 1)\n"
              "         {\n"
              "            switch_gyro_zapper_mode = true;\n"
              "            Api::Input(emulator).ConnectController(port, Api::Input::ZAPPER);\n"
              "         }\n"
              "         break;\n"
              "      case RETRO_DEVICE_ZAPPER:\n"
              "         if (port == 1) switch_gyro_zapper_mode = false;\n"
              "         Api::Input(emulator).ConnectController(port, Api::Input::ZAPPER);\n"
              "         break;\n"
          )
          replace_once(
              "   switch (zapper_device)\n",
              "   switch (switch_gyro_zapper_mode ? ZAPPER_DEVICE_POINTER : zapper_device)\n"
          )
          path.write_text(source)
          print("Nestopia Switch Gyro Zapper mode applied.")
          PY

      - name: Build Nestopia static core
        run: |
          make -C nestopia/libretro -j"$(getconf _NPROCESSORS_ONLN)" platform=libnx
          cp nestopia/libretro/nestopia_libretro_libnx.a retroarch/libretro_libnx.a

      - name: Build Switch NRO
        working-directory: retroarch
        run: |
          make -f Makefile.libnx -j"$(getconf _NPROCESSORS_ONLN)" clean
          make -f Makefile.libnx -j"$(getconf _NPROCESSORS_ONLN)" APP_TITLE="RetroArch Switch Gyro Pointer MODE"
          test -s retroarch_switch.nro
          grep -aFq '[Switch Zapper] patched gyro mouse driver active on pad 2' retroarch_switch.nro
          grep -aFq '1.22.1' retroarch_switch.nro
          grep -aFq 'Switch Gyro Zapper' retroarch_switch.nro
          grep -aFq '[Switch Zapper] core requested POINTER input on port 2' retroarch_switch.nro
          sha256sum retroarch_switch.nro

      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-switch-gyro-pointer-mode
          path: retroarch/retroarch_switch.nro
          if-no-files-found: error
