name: Build RetroArch Switch patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check out Nestopia core
        uses: actions/checkout@v4
        with:
          repository: libretro/nestopia
          ref: master
          path: nestopia
          submodules: recursive
      - name: Build Nestopia static core
        run: |
          make -C nestopia/libretro -j"$(getconf _NPROCESSORS_ONLN)" platform=libnx
          cp nestopia/libretro/nestopia_libretro_libnx.a libretro_libnx.a
      - name: Build Switch NRO
        run: |
          make -f Makefile.libnx -j"$(getconf _NPROCESSORS_ONLN)" clean
          make -f Makefile.libnx -j"$(getconf _NPROCESSORS_ONLN)" APP_TITLE="RetroArch Gyro Zapper TEST"
      - uses: actions/upload-artifact@v4
        with:
          name: retroarch-switch-patch
          path: retroarch_switch.nro
          if-no-files-found: error

